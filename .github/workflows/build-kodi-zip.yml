      - name: Build and validate Kodi install ZIP
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          addon_dir = Path("plugin.video.rutube")
          archive = Path("plugin.video.rutube.zip")

          if not (addon_dir / "addon.xml").is_file():
              raise SystemExit("Missing addon.xml")

          # Добавляем только файлы, без записей каталогов.
          with ZipFile(archive, "w", compression=ZIP_DEFLATED) as zf:
              for path in sorted(addon_dir.rglob("*")):
                  if path.is_file():
                      zf.write(path, path.as_posix())

          # Проверяем целостность и структуру.
          with ZipFile(archive, "r") as zf:
              bad = zf.testzip()
              if bad is not None:
                  raise SystemExit(f"ZIP integrity error: {bad}")

              names = zf.namelist()

              if not names:
                  raise SystemExit("Empty ZIP")

              if any(name.endswith("/") for name in names):
                  raise SystemExit("Directory entries are not allowed")

              if any(not name.startswith("plugin.video.rutube/") for name in names):
                  raise SystemExit("Unexpected path in ZIP")

              if "plugin.video.rutube/addon.xml" not in names:
                  raise SystemExit("Missing addon.xml")

          print(f"ZIP verified: {len(names)} files")
